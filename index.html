<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bivouac & Camping-car — Carte</title>
<meta name="theme-color" content="#1b5e20">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
    background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
    display: flex; flex-direction: column; gap: 8px;
  }
  #citySearchRow { display: flex; gap: 8px; }
  #citySearchInput {
    flex: 1; border: none; border-radius: 24px; padding: 12px 16px;
    font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  #citySearchBtn, #addSpotBtn, #favBtn {
    background: #fff; border: none; border-radius: 50%; width: 44px; height: 44px;
    font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.25); flex-shrink: 0;
  }
  #filterRow { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #filterRow::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0; border: none; border-radius: 16px; padding: 7px 12px 7px 10px;
    font-size: 13px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.2);
    background: #fff; color: #999; opacity: .5; display: flex; align-items: center; gap: 5px;
  }
  .filter-chip.active { opacity: 1; color: #222; }
  .filter-chip .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  #actionsRow { display: flex; gap: 8px; align-items: center; }
  #searchBtn {
    flex: 1; background: #fff; border: none; border-radius: 24px; padding: 12px 16px;
    font-size: 15px; font-weight: 600; color: #1b5e20; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  #addSpotBtn { color: #1b5e20; font-weight: 700; }
  #favBtn { color: #f5a623; }
  #legend {
    position: absolute; bottom: calc(66px + env(safe-area-inset-bottom)); left: 10px; z-index: 1000;
    background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 20px);
  }
  #bottomNav {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1500;
    display: flex; background: #fff; box-shadow: 0 -2px 10px rgba(0,0,0,.15);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .nav-item {
    flex: 1; border: none; background: none; display: flex; flex-direction: column;
    align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: #999; padding: 6px 0;
  }
  .nav-item .nav-icon { font-size: 21px; line-height: 1; }
  .nav-item.active { color: #1b5e20; }
  .legend-item { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display:inline-block; }
  #status {
    position: absolute; top: 118px; left: 10px; right: 10px; z-index: 1000; text-align:center;
    font-size: 13px; color: #fff; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 8px;
    display:none;
  }
  #status.show { display:block; }
  #status.error { background: rgba(183,28,28,.85); }

  /* Panneaux type "bottom sheet" (avis, ajout de lieu, favoris) */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 2000; display: none;
    background: rgba(0,0,0,.5);
  }
  .sheet-overlay.show { display: block; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 80vh;
    background: #fff; border-radius: 16px 16px 0 0; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-close {
    position: absolute; top: 10px; right: 14px; border: none; background: none;
    font-size: 20px; color: #888; padding: 4px 8px;
  }
  .sheet-title { margin: 0 0 10px; padding-right: 30px; font-size: 16px; color: #1b5e20; }
  .sheet-list { overflow-y: auto; flex: 1; margin-bottom: 10px; }

  /* Avis & photos */
  #avisStars { font-size: 28px; margin-bottom: 10px; letter-spacing: 4px; }
  #avisStars .star { color: #ccc; cursor: pointer; }
  #avisStars .star.active { color: #f5a623; }
  .avis-item { border-bottom: 1px solid #eee; padding: 8px 0; }
  .avis-item img { max-width: 100%; border-radius: 8px; margin-bottom: 6px; display:block; }
  .avis-item p { margin: 0 0 4px; font-size: 14px; }
  .avis-stars { color: #f5a623; font-size: 15px; margin-bottom: 2px; }
  .avis-date { font-size: 11px; color: #999; }
  #avisText {
    width: 100%; min-height: 60px; border: 1px solid #ddd; border-radius: 8px;
    padding: 8px; font-size: 14px; margin-bottom: 8px; font-family: inherit; resize: vertical;
  }
  #avisPhoto { margin-bottom: 10px; font-size: 13px; }
  .sheet-submit {
    background: #1b5e20; color: #fff; border: none; border-radius: 24px;
    padding: 12px; font-size: 15px; font-weight: 600;
  }
  .sheet-submit:disabled { opacity: .6; }
  .sheet-secondary {
    background: #f1f1f1; color: #333; border: none; border-radius: 24px;
    padding: 10px; font-size: 14px; font-weight: 600; margin-bottom: 8px;
  }

  /* Ajout de lieu */
  #addSpotStep2 { display: none; }
  #addSpotPositionLabel { font-size: 13px; color: #555; margin-bottom: 10px; }
  #addSpotAddressRow { display: flex; gap: 6px; margin-bottom: 8px; }
  #addSpotAddressInput {
    flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px;
  }
  #addSpotName, #addSpotCategory {
    width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px;
    font-size: 14px; margin-bottom: 8px; font-family: inherit;
  }
  #addSpotNotes {
    width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px;
    font-size: 14px; margin-bottom: 10px; font-family: inherit; min-height: 50px; resize: vertical;
  }

  /* Compte utilisateur : page plein écran (pas un bottom sheet) */
  #accountModal.auth-page {
    position: fixed; inset: 0; z-index: 3000; display: none;
    background: radial-gradient(circle at 50% -10%, #1f4323 0%, #0e1f10 45%, #060b06 100%);
    color: #fff;
  }
  #accountModal.auth-page.show { display: block; }
  .auth-close {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; z-index: 10;
    border: none; background: rgba(255,255,255,.08); color: #fff; width: 36px; height: 36px;
    border-radius: 50%; font-size: 16px; line-height: 1;
  }
  .auth-scroll {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(64px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom));
  }
  .auth-content { max-width: 420px; margin: 0 auto; text-align: center; }
  .auth-logo { font-size: 42px; text-align: center; margin-bottom: 14px; }
  .auth-title { text-align: center; font-size: 28px; line-height: 1.25; font-weight: 800; margin: 0 0 28px; }
  .auth-title-accent { color: #66bb6a; }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 22px; background: rgba(255,255,255,.07); padding: 4px; border-radius: 26px; }
  .auth-tabs .account-tab {
    flex: 1; border: none; background: transparent; color: rgba(255,255,255,.6);
    padding: 12px; border-radius: 22px; font-size: 14px; font-weight: 700;
  }
  .auth-tabs .account-tab.active { background: #1b5e20; color: #fff; }
  .auth-label {
    display: block; text-align: center; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: rgba(255,255,255,.5); margin: 14px 0 6px; font-weight: 700;
  }
  #accountModal .account-input {
    width: 100%; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 13px;
    font-size: 15px; font-family: inherit; background: rgba(255,255,255,.06); color: #fff;
    text-align: center;
  }
  #accountModal .account-input::placeholder { color: rgba(255,255,255,.35); }
  .auth-forgot { display: block; width: 100%; text-align: center; font-size: 13px; color: #8bc9a0; margin: 8px 0 4px; background: none; border: none; padding: 0; }
  .auth-oauth-logo { width: 18px; height: 18px; flex-shrink: 0; }
  .auth-submit {
    width: 100%; background: #1b5e20; color: #fff; border: none; border-radius: 26px;
    padding: 15px; font-size: 16px; font-weight: 700; margin-top: 16px;
  }
  .auth-submit:disabled { opacity: .6; }
  .auth-divider { text-align: center; color: rgba(255,255,255,.4); font-size: 13px; margin: 24px 0; position: relative; }
  .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: rgba(255,255,255,.15); }
  .auth-divider::before { left: 0; }
  .auth-divider::after { right: 0; }
  .auth-oauth-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(255,255,255,.95); color: #222; border: none; border-radius: 26px;
    padding: 14px; font-size: 15px; font-weight: 600; margin-bottom: 10px;
  }
  .auth-oauth-btn:disabled { opacity: .45; }
  .account-divider { text-align: center; color: #999; font-size: 12px; margin: 12px 0; }
  .account-error { color: #ff8a80; font-size: 13px; margin: 8px 0; min-height: 16px; }
  .oauth-note { font-size: 11px; color: rgba(255,255,255,.4); text-align: center; margin: -4px 0 10px; }
  .auth-sub { text-align: center; color: rgba(255,255,255,.55); font-size: 14px; margin: -18px 0 26px; }
  #accountModal .sheet-secondary { background: rgba(255,255,255,.1); color: #fff; }

  /* Statut légal */
  .legal-badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 12px; margin: 4px 0 8px;
  }
  .legal-autorise_officiel { background: #e8f5e9; color: #1b5e20; }
  .legal-tolere { background: #fff8e1; color: #8a6500; }
  .legal-interdit_signale { background: #ffebee; color: #b71c1c; }
  .legal-incertain { background: #f1f1f1; color: #666; }
  #addSpotLegalStatus { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 8px; font-family: inherit; }
  .constraints-block { border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .constraints-block label { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 8px; color: #444; }
  .constraints-block input[type="number"], .constraints-block input[type="text"], .constraints-block select {
    border: 1px solid #ddd; border-radius: 6px; padding: 7px; font-size: 13px; width: 100%; font-family: inherit;
  }
  .constraints-row { margin-bottom: 8px; }
  .spot-criteria { font-size: 12px; color: #555; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .spot-criteria span { background: #f1f1f1; border-radius: 10px; padding: 2px 8px; }

  /* Signalement de changement */
  .report-row { display: flex; gap: 6px; margin: 10px 0; border-top: 1px solid #eee; padding-top: 10px; }
  #reportText { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 13px; font-family: inherit; }
  #reportSubmit { background: #fff3e0; color: #8a4b00; border: none; border-radius: 8px; padding: 0 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .avis-item.is-report { background: #fff8e1; border-radius: 8px; padding: 8px; border-bottom: none; margin-bottom: 6px; }
  .avis-item.is-report .avis-report-label { font-weight: 700; color: #8a6500; font-size: 12px; }

  /* Profil */
  #profileForm input, #profileForm select { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 8px; font-family: inherit; }
  #profileSaved { font-size: 12px; color: #8bc9a0; min-height: 16px; }

  /* Favoris */
  .fav-item {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; cursor: pointer;
  }
  .fav-remove { border: none; background: none; color: #b71c1c; font-size: 16px; padding: 4px 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <div id="citySearchRow">
    <input type="text" id="citySearchInput" placeholder="Rechercher une ville, une adresse…">
    <button id="citySearchBtn" aria-label="Rechercher">🔍</button>
  </div>
  <div id="filterRow">
    <button class="filter-chip active" data-cls="aire"><span class="dot" style="background:#2e7d32"></span>Aires</button>
    <button class="filter-chip active" data-cls="camping"><span class="dot" style="background:#1565c0"></span>Campings</button>
    <button class="filter-chip active" data-cls="bivouac"><span class="dot" style="background:#e65100"></span>Bivouacs</button>
    <button class="filter-chip active" data-cls="community"><span class="dot" style="background:#8e24aa"></span>Communauté</button>
  </div>
  <div id="actionsRow">
    <button id="searchBtn">Rechercher dans cette zone</button>
    <button id="addSpotBtn" aria-label="Ajouter un lieu">➕</button>
    <button id="favBtn" aria-label="Mes favoris">★</button>
  </div>
</div>
<div id="status"></div>
<div id="legend">
  <span class="legend-item"><span class="dot" style="background:#2e7d32"></span>Aire camping-car</span>
  <span class="legend-item"><span class="dot" style="background:#1565c0"></span>Camping</span>
  <span class="legend-item"><span class="dot" style="background:#e65100"></span>Bivouac</span>
  <span class="legend-item"><span class="dot" style="background:#8e24aa"></span>Ajouté par la communauté</span>
</div>

<!-- Avis & photos (+ note par étoiles) -->
<div id="avisModal" class="sheet-overlay">
  <div class="sheet">
    <button id="avisClose" class="sheet-close">✕</button>
    <h3 class="sheet-title">Avis & photos</h3>
    <div id="avisList" class="sheet-list"></div>
    <div class="report-row">
      <input type="text" id="reportText" placeholder="Signaler : ce n'est plus vrai, fermé, devenu payant…">
      <button id="reportSubmit">⚠️ Signaler</button>
    </div>
    <div id="avisStars">
      <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
    </div>
    <textarea id="avisText" placeholder="Votre avis, une note sur ce spot..."></textarea>
    <input type="file" id="avisPhoto" accept="image/*">
    <button id="avisSubmit" class="sheet-submit">Envoyer</button>
  </div>
</div>

<!-- Ajout d'un nouveau lieu -->
<div id="addSpotModal" class="sheet-overlay">
  <div class="sheet">
    <button id="addSpotClose" class="sheet-close">✕</button>
    <h3 class="sheet-title">Ajouter un lieu</h3>

    <div id="addSpotStep1">
      <button id="addSpotUseLocation" class="sheet-secondary">📍 Utiliser ma position actuelle</button>
      <div id="addSpotAddressRow">
        <input type="text" id="addSpotAddressInput" placeholder="Taper une adresse…">
        <button id="addSpotAddressBtn" class="sheet-secondary" style="margin-bottom:0;width:auto;padding:10px 14px">Valider</button>
      </div>
      <button id="addSpotUseMap" class="sheet-secondary">🗺️ Toucher la carte pour placer le point</button>
    </div>

    <div id="addSpotStep2">
      <div id="addSpotPositionLabel"></div>
      <input type="text" id="addSpotName" placeholder="Nom du lieu *">
      <select id="addSpotCategory">
        <option value="aire">Aire camping-car</option>
        <option value="camping">Camping</option>
        <option value="bivouac">Bivouac</option>
      </select>
      <select id="addSpotLegalStatus">
        <option value="incertain">Statut légal : incertain / non vérifié</option>
        <option value="autorise_officiel">Autorisé officiellement</option>
        <option value="tolere">Toléré</option>
        <option value="interdit_signale">Interdit (signalé par la communauté)</option>
      </select>

      <div id="addSpotVehicleConstraints" class="constraints-block">
        <div class="constraints-row"><label>Hauteur max si barrière (m)<input type="number" step="0.1" id="csHeightLimit" placeholder="ex: 3.2"></label></div>
        <div class="constraints-row"><label><input type="checkbox" id="csHasWater" style="width:auto;margin:0">Point d'eau disponible</label></div>
        <div class="constraints-row"><label><input type="checkbox" id="csHasDump" style="width:auto;margin:0">Vidange disponible</label></div>
        <div class="constraints-row"><label>Prix indicatif<input type="text" id="csPrice" placeholder="ex: 10€/nuit ou gratuit"></label></div>
      </div>

      <div id="addSpotHikingConstraints" class="constraints-block" style="display:none">
        <div class="constraints-row"><label>Distance de marche depuis un accès véhicule (m)<input type="number" id="hcWalkDistance" placeholder="ex: 800"></label></div>
        <div class="constraints-row"><label>Dénivelé (m)<input type="number" id="hcElevation" placeholder="ex: 150"></label></div>
        <div class="constraints-row"><label>Exposition
          <select id="hcExposure"><option value="">Non précisé</option><option value="abrite">Abrité</option><option value="expose">Exposé</option></select>
        </label></div>
        <div class="constraints-row"><label><input type="checkbox" id="hcFireAllowed" style="width:auto;margin:0">Feu autorisé</label></div>
      </div>

      <textarea id="addSpotNotes" placeholder="Notes (payant ou non, infos libres)…"></textarea>
      <button id="addSpotBack" class="sheet-secondary">← Changer la position</button>
      <button id="addSpotSubmit" class="sheet-submit">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Favoris -->
<div id="favModal" class="sheet-overlay">
  <div class="sheet">
    <button id="favClose" class="sheet-close">✕</button>
    <h3 class="sheet-title">Mes favoris</h3>
    <div id="favList" class="sheet-list"></div>
  </div>
</div>

<!-- Compte utilisateur : page plein écran -->
<div id="accountModal" class="auth-page">
  <button id="accountClose" class="auth-close">✕</button>
  <div class="auth-scroll">
    <div class="auth-content">
      <div class="auth-logo">⛺</div>
      <h1 class="auth-title">Trouve ton bivouac,<br><span class="auth-title-accent">en toute confiance.</span></h1>

      <!-- Connexion / Création de compte -->
      <div id="accountLoggedOut">
        <div id="accountTabs" class="auth-tabs">
          <button id="tabLogin" class="account-tab active">Connexion</button>
          <button id="tabSignup" class="account-tab">Inscription</button>
        </div>

        <div id="loginPane">
          <label class="auth-label" for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" class="account-input" placeholder="ton@email.com" autocomplete="email">
          <label class="auth-label" for="loginPassword">Mot de passe</label>
          <input type="password" id="loginPassword" class="account-input" placeholder="••••••••" autocomplete="current-password">
          <button type="button" id="forgotPasswordBtn" class="auth-forgot">Mot de passe oublié ?</button>
          <div id="loginError" class="account-error"></div>
          <button id="loginSubmit" class="auth-submit">Se connecter</button>
        </div>

        <div id="signupPane" style="display:none">
          <label class="auth-label" for="signupEmail">E-mail</label>
          <input type="email" id="signupEmail" class="account-input" placeholder="ton@email.com" autocomplete="email">
          <label class="auth-label" for="signupPassword">Mot de passe</label>
          <input type="password" id="signupPassword" class="account-input" placeholder="6 caractères min." autocomplete="new-password">
          <div id="signupError" class="account-error"></div>
          <button id="signupSubmit" class="auth-submit">Créer mon compte</button>
        </div>

        <div class="auth-divider">ou</div>
        <button id="oauthGoogle" class="auth-oauth-btn" disabled title="Bientôt disponible">
          <svg class="auth-oauth-logo" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.1 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.7 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.1 5.1 29.3 3 24 3 16 3 9.1 7.6 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.3 26.7 37 24 37c-5.3 0-9.7-3.1-11.3-7.6l-6.5 5C9 40.3 16 45 24 45z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C40.3 36.4 44 30.9 44 24c0-1.2-.1-2.4-.4-3.5z"/>
          </svg>
          Continuer avec Google
        </button>
        <button id="oauthApple" class="auth-oauth-btn" disabled title="Bientôt disponible">🍎 Continuer avec Apple</button>
        <div class="oauth-note">Connexion Google/Apple bientôt disponible</div>
      </div>

      <!-- Code de confirmation envoyé par e-mail -->
      <div id="accountConfirm" style="display:none">
        <p class="auth-sub" style="margin-top:0">Un code a été envoyé à <strong id="confirmEmailLabel" style="color:#fff"></strong>. Saisis-le pour activer ton compte.</p>
        <label class="auth-label" for="confirmCode">Code de confirmation</label>
        <input type="text" id="confirmCode" class="account-input" placeholder="Code reçu par e-mail" inputmode="numeric" maxlength="12">
        <div id="confirmError" class="account-error"></div>
        <button id="confirmSubmit" class="auth-submit">Valider le code</button>
        <button id="confirmResend" class="sheet-secondary" style="margin-top:10px">Renvoyer le code</button>
        <button id="confirmBack" class="auth-forgot" style="margin-top:14px">← Retour</button>
      </div>

      <!-- Connecté -->
      <div id="accountLoggedIn" style="display:none">
        <p class="auth-sub" style="margin-top:0">Connecté en tant que <strong style="color:#fff" id="accountEmailLabel"></strong></p>
        <div id="profileForm">
          <label class="auth-label" for="profilePseudo">Pseudo</label>
          <input type="text" id="profilePseudo" class="account-input" placeholder="Pseudo" maxlength="30">
          <label class="auth-label" for="profileTravelerType">Type de voyageur</label>
          <select id="profileTravelerType" class="account-input">
            <option value="">Non précisé</option>
            <option value="camping_car">Camping-car / van</option>
            <option value="bivouac_tente">Bivouac en tente</option>
            <option value="les_deux">Les deux</option>
          </select>
          <button id="profileSaveBtn" class="auth-submit">Enregistrer mon profil</button>
          <div id="profileSaved" style="text-align:center;margin-top:8px"></div>
        </div>
        <button id="logoutBtn" class="sheet-secondary" style="width:100%;margin-top:16px">Se déconnecter</button>
      </div>
    </div>
  </div>
</div>

<!-- Navigation du bas -->
<nav id="bottomNav">
  <button class="nav-item active" id="navMap"><span class="nav-icon">🗺️</span>Carte</button>
  <button class="nav-item" id="navAccount"><span class="nav-icon">👤</span>Compte</button>
</nav>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').then((reg) => {
        // Force une vérification de mise à jour à chaque chargement, pour ne pas rester
        // bloqué sur une ancienne version en cache (problème rencontré en usage réel).
        reg.update();
      }).catch(() => {});
    });
    // Dès qu'une nouvelle version prend le contrôle, on recharge une fois automatiquement.
    let swRefreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (swRefreshing) return;
      swRefreshing = true;
      window.location.reload();
    });
  }
</script>
</body>
