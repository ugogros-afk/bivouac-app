<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bivouac & Camping-car — Carte</title>
<meta name="theme-color" content="#1b5e20">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
    background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
    display: flex; flex-direction: column; gap: 8px;
  }
  #citySearchRow { display: flex; gap: 8px; }
  #citySearchInput {
    flex: 1; border: none; border-radius: 24px; padding: 12px 16px;
    font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  #citySearchBtn, #addSpotBtn, #favBtn {
    background: #fff; border: none; border-radius: 50%; width: 44px; height: 44px;
    font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.25); flex-shrink: 0;
  }
  #filterRow { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #filterRow::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0; border: none; border-radius: 16px; padding: 7px 12px 7px 10px;
    font-size: 13px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.2);
    background: #fff; color: #999; opacity: .5; display: flex; align-items: center; gap: 5px;
  }
  .filter-chip.active { opacity: 1; color: #222; }
  .filter-chip .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  #actionsRow { display: flex; gap: 8px; align-items: center; }
  #searchBtn {
    flex: 1; background: #fff; border: none; border-radius: 24px; padding: 12px 16px;
    font-size: 15px; font-weight: 600; color: #1b5e20; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  #addSpotBtn { color: #1b5e20; font-weight: 700; }
  #favBtn { color: #f5a623; }
  #legend {
    position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); left: 10px; z-index: 1000;
    background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 20px);
  }
  .legend-item { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display:inline-block; }
  #status {
    position: absolute; top: 118px; left: 10px; right: 10px; z-index: 1000; text-align:center;
    font-size: 13px; color: #fff; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 8px;
    display:none;
  }
  #status.show { display:block; }
  #status.error { background: rgba(183,28,28,.85); }

  /* Panneaux type "bottom sheet" (avis, ajout de lieu, favoris) */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 2000; display: none;
    background: rgba(0,0,0,.5);
  }
  .sheet-overlay.show { display: block; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 80vh;
    background: #fff; border-radius: 16px 16px 0 0; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-close {
    position: absolute; top: 10px; right: 14px; border: none; background: none;
    font-size: 20px; color: #888; padding: 4px 8px;
  }
  .sheet-title { margin: 0 0 10px; padding-right: 30px; font-size: 16px; color: #1b5e20; }
  .sheet-list { overflow-y: auto; flex: 1; margin-bottom: 10px; }

  /* Avis & photos */
  #avisStars { font-size: 28px; margin-bottom: 10px; letter-spacing: 4px; }
  #avisStars .star { color: #ccc; cursor: pointer; }
  #avisStars .star.active { color: #f5a623; }
  .avis-item { border-bottom: 1px solid #eee; padding: 8px 0; }
  .avis-item img { max-width: 100%; border-radius: 8px; margin-bottom: 6px; display:block; }
  .avis-item p { margin: 0 0 4px; font-size: 14px; }
  .avis-stars { color: #f5a623; font-size: 15px; margin-bottom: 2px; }
  .avis-date { font-size: 11px; color: #999; }
  #avisText {
    width: 100%; min-height: 60px; border: 1px solid #ddd; border-radius: 8px;
    padding: 8px; font-size: 14px; margin-bottom: 8px; font-family: inherit; resize: vertical;
  }
  #avisPhoto { margin-bottom: 10px; font-size: 13px; }
  .sheet-submit {
    background: #1b5e20; color: #fff; border: none; border-radius: 24px;
    padding: 12px; font-size: 15px; font-weight: 600;
  }
  .sheet-submit:disabled { opacity: .6; }
  .sheet-secondary {
    background: #f1f1f1; color: #333; border: none; border-radius: 24px;
    padding: 10px; font-size: 14px; font-weight: 600; margin-bottom: 8px;
  }

  /* Ajout de lieu */
  #addSpotStep2 { display: none; }
  #addSpotPositionLabel { font-size: 13px; color: #555; margin-bottom: 10px; }
  #addSpotAddressRow { display: flex; gap: 6px; margin-bottom: 8px; }
  #addSpotAddressInput {
    flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px;
  }
  #addSpotName, #addSpotCategory {
    width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px;
    font-size: 14px; margin-bottom: 8px; font-family: inherit;
  }
  #addSpotNotes {
    width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px;
    font-size: 14px; margin-bottom: 10px; font-family: inherit; min-height: 50px; resize: vertical;
  }

  /* Favoris */
  .fav-item {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; cursor: pointer;
  }
  .fav-remove { border: none; background: none; color: #b71c1c; font-size: 16px; padding: 4px 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <div id="citySearchRow">
    <input type="text" id="citySearchInput" placeholder="Rechercher une ville, une adresse…">
    <button id="citySearchBtn" aria-label="Rechercher">🔍</button>
  </div>
  <div id="filterRow">
    <button class="filter-chip active" data-cls="aire"><span class="dot" style="background:#2e7d32"></span>Aires</button>
    <button class="filter-chip active" data-cls="camping"><span class="dot" style="background:#1565c0"></span>Campings</button>
    <button class="filter-chip active" data-cls="bivouac"><span class="dot" style="background:#e65100"></span>Bivouacs</button>
    <button class="filter-chip active" data-cls="community"><span class="dot" style="background:#8e24aa"></span>Communauté</button>
  </div>
  <div id="actionsRow">
    <button id="searchBtn">Rechercher dans cette zone</button>
    <button id="addSpotBtn" aria-label="Ajouter un lieu">➕</button>
    <button id="favBtn" aria-label="Mes favoris">★</button>
  </div>
</div>
<div id="status"></div>
<div id="legend">
  <span class="legend-item"><span class="dot" style="background:#2e7d32"></span>Aire camping-car</span>
  <span class="legend-item"><span class="dot" style="background:#1565c0"></span>Camping</span>
  <span class="legend-item"><span class="dot" style="background:#e65100"></span>Bivouac</span>
  <span class="legend-item"><span class="dot" style="background:#8e24aa"></span>Ajouté par la communauté</span>
</div>

<!-- Avis & photos (+ note par étoiles) -->
<div id="avisModal" class="sheet-overlay">
  <div class="sheet">
    <button id="avisClose" class="sheet-close">✕</button>
    <h3 class="sheet-title">Avis & photos</h3>
    <div id="avisList" class="sheet-list"></div>
    <div id="avisStars">
      <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
    </div>
    <textarea id="avisText" placeholder="Votre avis, une note sur ce spot..."></textarea>
    <input type="file" id="avisPhoto" accept="image/*">
    <button id="avisSubmit" class="sheet-submit">Envoyer</button>
  </div>
</div>

<!-- Ajout d'un nouveau lieu -->
<div id="addSpotModal" class="sheet-overlay">
  <div class="sheet">
    <button id="addSpotClose" class="sheet-close">✕</button>
    <h3 class="sheet-title">Ajouter un lieu</h3>

    <div id="addSpotStep1">
      <button id="addSpotUseLocation" class="sheet-secondary">📍 Utiliser ma position actuelle</button>
      <div id="addSpotAddressRow">
        <input type="text" id="addSpotAddressInput" placeholder="Taper une adresse…">
        <button id="addSpotAddressBtn" class="sheet-secondary" style="margin-bottom:0;width:auto;padding:10px 14px">Valider</button>
      </div>
      <button id="addSpotUseMap" class="sheet-secondary">🗺️ Toucher la carte pour placer le point</button>
    </div>

    <div id="addSpotStep2">
      <div id="addSpotPositionLabel"></div>
      <input type="text" id="addSpotName" placeholder="Nom du lieu *">
      <select id="addSpotCategory">
        <option value="aire">Aire camping-car</option>
        <option value="camping">Camping</option>
        <option value="bivouac">Bivouac</option>
      </select>
      <textarea id="addSpotNotes" placeholder="Notes (payant ou non, infos libres)…"></textarea>
      <button id="addSpotBack" class="sheet-secondary">← Changer la position</button>
      <button id="addSpotSubmit" class="sheet-submit">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Favoris -->
<div id="favModal" class="sheet-overlay">
  <div class="sheet">
    <button id="favClose" class="sheet-close">✕</button>
    <h3 class="sheet-title">Mes favoris</h3>
    <div id="favList" class="sheet-list"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="spots-data.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
